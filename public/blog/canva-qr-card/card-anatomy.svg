<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Wedding QR code card layout</title>
  <desc id="desc">Illustration of a wedding QR code card: names and date at the top, a QR code in the middle, and a short instruction line below.</desc>

  <rect width="1200" height="720" fill="#FFF9EC" />

  <!-- Card shadow -->
  <rect x="366" y="128" width="468" height="500" rx="28" fill="#0F1729" opacity="0.06" />

  <!-- Card -->
  <rect x="350" y="110" width="468" height="500" rx="28" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" />

  <!-- Names line -->
  <rect x="454" y="152" width="260" height="26" rx="8" fill="#0F1729" />
  <!-- Date line -->
  <rect x="524" y="192" width="120" height="14" rx="6" fill="#C9820A" opacity="0.7" />

  <!-- QR code placeholder -->
  <g>
    <rect x="454" y="238" width="260" height="260" rx="16" fill="#0F1729" />

    <!-- Finder squares (top-left, top-right, bottom-left) -->
    <g fill="#FFFFFF">
      <rect x="470" y="254" width="48" height="48" rx="6" />
      <rect x="646" y="254" width="48" height="48" rx="6" />
      <rect x="470" y="430" width="48" height="48" rx="6" />
    </g>
    <g fill="#0F1729">
      <rect x="482" y="266" width="24" height="24" rx="3" />
      <rect x="658" y="266" width="24" height="24" rx="3" />
      <rect x="482" y="442" width="24" height="24" rx="3" />
    </g>

    <!-- Scattered data modules -->
    <g fill="#FFFFFF">
      <rect x="534" y="254" width="14" height="14" />
      <rect x="562" y="254" width="14" height="14" />
      <rect x="598" y="254" width="14" height="14" />
      <rect x="534" y="282" width="14" height="14" />
      <rect x="570" y="282" width="14" height="14" />
      <rect x="614" y="282" width="14" height="14" />
      <rect x="646" y="310" width="14" height="14" />
      <rect x="678" y="310" width="14" height="14" />
      <rect x="534" y="326" width="14" height="14" />
      <rect x="558" y="350" width="14" height="14" />
      <rect x="586" y="326" width="14" height="14" />
      <rect x="614" y="350" width="14" height="14" />
      <rect x="646" y="374" width="14" height="14" />
      <rect x="534" y="398" width="14" height="14" />
      <rect x="562" y="374" width="14" height="14" />
      <rect x="598" y="398" width="14" height="14" />
      <rect x="646" y="430" width="14" height="14" />
      <rect x="678" y="454" width="14" height="14" />
      <rect x="558" y="454" width="14" height="14" />
      <rect x="598" y="470" width="14" height="14" />
    </g>
  </g>

  <!-- Instruction line -->
  <rect x="484" y="528" width="200" height="16" rx="6" fill="#9CA3AF" />

  <!-- Amber "scan" badge -->
  <circle cx="784" cy="570" r="34" fill="#FFC94D" />
  <path d="M770 570 l10 10 l22 -22" stroke="#0F1729" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
</svg>
