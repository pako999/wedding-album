<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Natisnjeni QR podstavki za mize">
  <!-- Illustration of the printed QR table stands: three tent cards on a
       table, the front one carrying the album QR code. Drawn rather than
       photographed because there is no product shot yet — swapping in a
       real photo means pointing the <img> at a .webp instead. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBF1"/>
      <stop offset="1" stop-color="#FBF1D9"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F6FA"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DCE0E9"/>
      <stop offset="1" stop-color="#C6CBD8"/>
    </linearGradient>
  </defs>

  <rect width="320" height="240" rx="16" fill="url(#bg)"/>

  <!-- table surface -->
  <path d="M0 186h320v38a16 16 0 0 1-16 16H16A16 16 0 0 1 0 224z" fill="#E9DBBE" opacity=".5"/>
  <line x1="0" y1="186" x2="320" y2="186" stroke="#D9C79F" stroke-width="1.5" opacity=".6"/>

  <!-- ── back-left stand ─────────────────────────────────────────── -->
  <g opacity=".38">
    <ellipse cx="62" cy="180" rx="30" ry="5" fill="#0F1729" opacity=".18"/>
    <path d="M40 178V96a3 3 0 0 1 3-3h38a3 3 0 0 1 3 3v82z" fill="url(#face)" stroke="#DCE0E9" stroke-width="1.5"/>
    <path d="M84 178V96a3 3 0 0 0-3-3h7a3 3 0 0 1 3 3v82z" fill="url(#edge)"/>
    <rect x="49" y="112" width="26" height="26" rx="2" fill="#FFF" stroke="#E2E5EC"/>
    <rect x="52" y="150" width="20" height="4" rx="2" fill="#0F1729" opacity=".3"/>
  </g>

  <!-- ── back-right stand ────────────────────────────────────────── -->
  <g opacity=".62">
    <ellipse cx="248" cy="182" rx="36" ry="6" fill="#0F1729" opacity=".18"/>
    <path d="M220 180V86a3 3 0 0 1 3-3h48a3 3 0 0 1 3 3v94z" fill="url(#face)" stroke="#DCE0E9" stroke-width="1.5"/>
    <path d="M274 180V86a3 3 0 0 0-3-3h8a3 3 0 0 1 3 3v94z" fill="url(#edge)"/>
    <rect x="228" y="104" width="38" height="38" rx="3" fill="#FFF" stroke="#E2E5EC"/>
    <g fill="#0F1729" opacity=".8">
      <path d="M232 108h10v10h-10zm3 3v4h4v-4z"/>
      <path d="M252 108h10v10h-10zm3 3v4h4v-4z"/>
      <path d="M232 128h10v10h-10zm3 3v4h4v-4z"/>
      <rect x="247" y="110" width="3" height="3"/><rect x="253" y="123" width="3" height="3"/>
      <rect x="247" y="131" width="3" height="3"/><rect x="259" y="127" width="3" height="3"/>
      <rect x="253" y="135" width="3" height="3"/>
    </g>
    <rect x="230" y="152" width="34" height="4" rx="2" fill="#0F1729" opacity=".32"/>
  </g>

  <!-- ── front stand (the hero) ──────────────────────────────────── -->
  <ellipse cx="152" cy="188" rx="52" ry="8" fill="#0F1729" opacity=".16"/>
  <path d="M108 186V62a4 4 0 0 1 4-4h72a4 4 0 0 1 4 4v124z" fill="url(#face)" stroke="#D5DAE4" stroke-width="1.8"/>
  <path d="M188 186V62a4 4 0 0 0-4-4h10a4 4 0 0 1 4 4v124z" fill="url(#edge)"/>

  <!-- heading -->
  <rect x="122" y="74" width="52" height="6" rx="3" fill="#0F1729" opacity=".78"/>
  <rect x="132" y="87" width="32" height="4" rx="2" fill="#0F1729" opacity=".3"/>

  <!-- QR code -->
  <rect x="118" y="100" width="60" height="60" rx="4" fill="#FFFFFF" stroke="#E2E5EC"/>
  <g fill="#0F1729">
    <path d="M123 105h16v16h-16zm4 4v8h8v-8z"/>
    <path d="M157 105h16v16h-16zm4 4v8h8v-8z"/>
    <path d="M123 139h16v16h-16zm4 4v8h8v-8z"/>
    <rect x="144" y="106" width="4" height="4"/><rect x="150" y="112" width="4" height="4"/>
    <rect x="144" y="118" width="4" height="4"/><rect x="156" y="126" width="4" height="4"/>
    <rect x="144" y="132" width="4" height="4"/><rect x="150" y="138" width="4" height="4"/>
    <rect x="162" y="132" width="4" height="4"/><rect x="156" y="144" width="4" height="4"/>
    <rect x="144" y="150" width="4" height="4"/><rect x="168" y="144" width="4" height="4"/>
    <rect x="162" y="150" width="4" height="4"/><rect x="132" y="126" width="4" height="4"/>
  </g>

  <!-- caption under the QR -->
  <rect x="120" y="168" width="56" height="5" rx="2.5" fill="#0F1729" opacity=".4"/>
</svg>
