name: Wedding blog translations verification
on:
  push:
    branches: [content/wedding-premium-news-20260927]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run audit:i18n
      - run: npm run test:regression
      - run: npx next build
