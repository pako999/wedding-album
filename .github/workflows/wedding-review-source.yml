name: GuestCam wedding implementation verification
on:
  push:
    branches: [feat/guestcam-wedding-premium-20260926]
permissions:
  contents: write
concurrency:
  group: guestcam-wedding-upgrade
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/guestcam-wedding-premium-20260926'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-local-password
          POSTGRES_USER: postgres
          POSTGRES_DB: guestcam_wedding_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply verified source changes
        run: python3 .upgrade/apply.py
      - name: Self-host existing GuestCam landscape video
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          curl -fL --retry 2 --max-time 120 'https://www.dropbox.com/scl/fi/qtuzczykxuoa9q19lktyb/guestcam_16x9.mp4?rlkey=5w335kv6w5b90t8q4js3w7e3u&raw=1' -o "$RUNNER_TEMP/guestcam-original.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$RUNNER_TEMP/guestcam-original.mp4" | grep -q video
          ffmpeg -hide_banner -loglevel error -y -i "$RUNNER_TEMP/guestcam-original.mp4" -vf 'scale=min(1280\,iw):-2' -c:v libx264 -preset fast -crf 24 -c:a aac -b:a 96k -movflags +faststart public/promo/guestcam-desktop.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 1 -i public/promo/guestcam-desktop.mp4 -frames:v 1 -vf scale=1280:-2 public/promo/guestcam-desktop-poster.webp
          test $(stat -c%s public/promo/guestcam-desktop.mp4) -lt 90000000
      - name: Commit implementation to isolated branch
        run: |
          git config user.name 'Patrik'
          git config user.email '125508378+pako999@users.noreply.github.com'
          git add --pathspec-from-file="$RUNNER_TEMP/wedding-paths.txt"
          git add public/promo/guestcam-desktop.mp4 public/promo/guestcam-desktop-poster.webp
          git rm -r .upgrade .github/workflows/wedding-review-source.yml
          git diff --cached --stat
          git commit -m 'feat: GuestCam wedding premium with six-language guest, host, DJ and bingo experience'
          git push origin HEAD:feat/guestcam-wedding-premium-20260926
          git archive --format=zip HEAD -o "$RUNNER_TEMP/guestcam-wedding-source.zip"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        id: types
        continue-on-error: true
        run: |
          npx next typegen
          npx tsc --noEmit
      - name: Regression and translation coverage
        id: regression
        continue-on-error: true
        run: npm run test:regression && npm run audit:i18n && npm run test:wedding
      - name: Isolated PostgreSQL migration and bingo integration
        id: database
        continue-on-error: true
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-only-local-password
          PGDATABASE: guestcam_wedding_ci
        run: |
          test "$PGDATABASE" = guestcam_wedding_ci
          test "$PGHOST" = 127.0.0.1
          psql -f scripts/wedding-schema-test.sql
      - name: Browser checks and screenshots without customer access
        id: browser
        continue-on-error: true
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install --with-deps chromium
          node scripts/wedding-browser-check.mjs
      - name: Verification results
        if: always()
        env:
          TYPE_RESULT: ${{ steps.types.outcome }}
          REGRESSION_RESULT: ${{ steps.regression.outcome }}
          DATABASE_RESULT: ${{ steps.database.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
        run: |
          printf 'Types: %s\nRegressions: %s\nDatabase: %s\nBrowser: %s\n' "$TYPE_RESULT" "$REGRESSION_RESULT" "$DATABASE_RESULT" "$BROWSER_RESULT" | tee "$RUNNER_TEMP/wedding-results.txt" >> "$GITHUB_STEP_SUMMARY"
          test "$TYPE_RESULT" = success && test "$REGRESSION_RESULT" = success && test "$DATABASE_RESULT" = success && test "$BROWSER_RESULT" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guestcam-wedding-verification
          path: |
            ${{ runner.temp }}/guestcam-wedding-source.zip
            ${{ runner.temp }}/wedding-results.txt
            wedding-test-results/
          retention-days: 3
