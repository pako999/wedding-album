name: Retire custom domains (isolated branch)
on:
  push:
    branches: [fix/remove-custom-domains-20260928]
    paths: [.github/workflows/retire-custom-domains-once.yml]
permissions:
  contents: write
jobs:
  retire-and-verify:
    if: github.repository == 'pako999/wedding-album'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-custom-domains-20260928
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply scoped removal and replace the obsolete settings test
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          // Reuse the reviewed AST edit script from its immutable preparatory commit.
          const original = execFileSync('git', ['show', 'f734ff98eb9c054745348d18d810a85ca01ff6d2:.github/workflows/retire-custom-domains-once.yml'], {encoding: 'utf8'});
          const match = original.match(/^          node <<'NODE'\n([\s\S]*?)^          NODE$/m);
          assert.ok(match, 'Pinned removal script is present');
          let script = match[1].split('\n').map(line => line.startsWith('          ') ? line.slice(10) : line).join('\n');
          // Also retire the business FAQ explicitly promising a customer domain.
          assert.ok(script.includes("name(p) === 'title'"));
          script = script.replace("name(p) === 'title'", "['title', 'q'].includes(name(p))");
          script = script.replace('headOffer.test(title.initializer.text.trim())', 'offer.test(title.initializer.text.trim())');
          execFileSync(process.execPath, ['-e', script], {stdio: 'inherit'});
          const path = 'scripts/regression-check.mjs';
          const before = fs.readFileSync(path, 'utf8');
          const obsolete = /requireMatch\(\n  "custom domains require valid DNS before being shown as connected",[\s\S]*?\n\);/;
          assert.ok(obsolete.test(before), 'Only the retired UI assertion is replaced');
          fs.writeFileSync(path, before.replace(obsolete, `requireAbsent(
            "retired custom domain settings are not offered to album owners",
            files.albumAdminPanel,
            /CustomDomainPanel|copy\\.domainPlaceholder|copy\\.dnsMissing/,
            "no plan may expose domain registration or its premium upsell in user settings",
          );`));
          const testPath = 'scripts/custom-domain-retirement-check.mjs';
          fs.appendFileSync(testPath, `
          assert.ok(!/domainBenefit/.test(read('components/wedding/WeddingLandingPage.tsx')), 'Wedding landing pages do not advertise domains');
          for (const dir of ['lib/blog','lib/i18n','lib/seo']) scan(dir);
          // Exercise the actual compiled POST handler with external services stubbed.
          const { createRequire } = await import('node:module');
          const require = createRequire(import.meta.url);
          const ts = require('typescript');
          const vm = require('node:vm');
          const compiled = ts.transpileModule(route, {compilerOptions: {module: ts.ModuleKind.CommonJS, target: ts.ScriptTarget.ES2022}}).outputText;
          let externalCalls = 0;
          const sandbox = { exports: {}, require(id) {
            if (id === 'next/server') return {NextResponse: {json(body, init) {return {body, ...init};}}};
            return new Proxy({}, {get() {return new Proxy(function() {externalCalls++; throw new Error('Retired registration attempted an external call');}, {get() {externalCalls++; throw new Error('Retired registration attempted external data access');}});}});
          }};
          vm.runInNewContext(compiled, sandbox);
          const retired = await sandbox.exports.POST();
          assert.equal(retired.status, 410);
          assert.equal(retired.body.code, 'CUSTOM_DOMAINS_RETIRED');
          assert.equal(externalCalls, 0, 'Retired registration never calls the DB or Vercel');
          console.log('Retired POST runtime check: HTTP 410, zero external calls.');
          `);
          // AST removal can leave indentation on otherwise empty lines.
          const changed = execFileSync('git', ['diff', '--name-only'], {encoding:'utf8'}).trim().split('\n').filter(Boolean);
          for (const file of [...changed, testPath]) {
            if (!/\.(tsx?|mjs|json)$/.test(file)) continue;
            const value = fs.readFileSync(file, 'utf8');
            fs.writeFileSync(file, value.replace(/^[\t ]+$/gm, ''));
          }
          NODE
      - name: Next route types
        run: npx next typegen
      - name: TypeScript verification
        run: npx tsc --noEmit
      - name: Regressions and retirement guards
        run: npm run test:regression
      - name: All language and wedding checks
        run: npm run audit:i18n && npm run test:wedding && npm run test:premium-offer
      - name: Production build without deployment database migration
        run: npx next build
      - name: Commit verified product changes to the isolated branch only
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/GuestcamHomePage.tsx components/LocalizedHomePage.tsx components/LocalizedGuestcamHomePageV3.tsx app/sl/qr-koda-za-poslovne-dogodke/page.tsx lib/wedding/copy.ts components/dashboard/AlbumAdminPanel.tsx lib/i18n/admin-settings-copy.ts 'app/api/albums/[slug]/domain/route.ts' scripts/custom-domain-retirement-check.mjs scripts/regression-check.mjs package.json
          git commit -m 'fix: retire custom domains from packages and user admin'
          git push origin HEAD:refs/heads/fix/remove-custom-domains-20260928
